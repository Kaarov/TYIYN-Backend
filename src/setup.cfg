[flake8]
ignore =
    C812, # missing trailing comma
    D100, # Missing docstring in public module
    D101, # Missing docstring in public class
    D102, # Missing docstring in public method
    D103, # Missing docstring in public function
    D105, # Missing docstring in magic method
    D106, # Missing docstring in public nested class
    D107, # Missing docstring in __init__
    DAR401, # Missing exception(s) in Raises section: -r ImportError
    F401, # 'users.signals' imported but unused
    N806, # variable 'Model' in function should be lowercase
    N818, # exception name 'TyiynBaseException', 'TyiynAuthenticationFailed', ... should be named with an Error suffix
    RST201, #  Block quote ends without a blank line; unexpected unindent.
    P101, #  format string does contain unindexed parameters
    RST203, # Definition list ends without a blank line; unexpected unindent.
    RST301, # Unexpected indentation.
    Q000, # Double quotes found but single quotes preferred
    WPS110, # Found wrong variable name: file
    WPS115, # Found upper-case constant in a class: ENGLISH, RUSSIAN, KYRGYZ
    WPS212, # Found too many return statements: 7 > 5
    WPS221, # Found line with high Jones Complexity: 15 > 14
    WPS226, # Found string literal over-use: NAME > 3
    WPS229, # Found too long ``try`` body length: 3 > 1
    WPS231, # Found function with too much cognitive complexity: 20 > 12
    WPS237, # Found a too complex `f` string
    WPS300, # Found local folder import
    WPS301, # Found dotted raw import: users.signals
    WPS305, # Found `f` string
    WPS306, # Found class without a base class: Meta
    WPS323, # Found `%` string formatting
    WPS326, # Found implicit string concatenation
    WPS348, # Found a line that starts with a dot
    WPS400, # Found wrong magic comment: noqa F841
    WPS407, # Found mutable module constant
    WPS432, # Found magic number: 255
    WPS433, # Found nested import
    WPS504, # Found negated condition
    WPS508, # Found incorrect `not` with compare usage
    WPS510, # Found `in` used with a non-set container
    WPS516, # Found `type()` used to compare types
    WPS601, # Found shadowed class attribute: code, message, http_code, field_errors
    WPS615, # Found unpythonic getter or setter

exclude =
    .git,
    __pycache__,
    __init__.py,
    migrations,
    .venv
per-file-ignores =
# There are multiple `assert`s in tests, we allow them:
;    src/tests/*.py: S101
max-local-variables = 15
max-methods = 15
max-line-length = 120

[isort]
profile = black
multi_line_output = 3
skip =
    .venv
    migrations

[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined
warn_no_return = False
exclude = migrations

[tool:pytest]
testpaths = tests
addopts = -ra -q

[coverage:run]
omit =
    */migrations/*
    */__init__.py
    .venv/*
    /app/.venv/*
    tests/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
