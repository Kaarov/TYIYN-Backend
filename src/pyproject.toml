[tool.poetry]
name = "tyiyn"
version = "0.1.0"
description = ""
authors = []
packages = [{ include = "config" }]

[tool.poetry.dependencies]
python = "~3.11"
pillow = "^11.1.0"
requests = "^2.32.3"

django = "4.2"
django-4-jet = "^1.0.9"
django-cors-headers = "^4.7.0"
django-environ = "^0.12.0"
django-filter = "^25.1"
django-rest-swagger = "^2.2.0"
djangorestframework = "^3.16.0"
djangorestframework-simplejwt = "^5.5.0"
drf-spectacular = "^0.28.0"

whitenoise = "^6.9.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1"
bandit = "^1.7.5"
flake8 = ">=3.7,<5"
wemake-python-styleguide = "^0.17.0"
isort = "^5.12.0"
black = "^23.7.0"
pytest = "^7.4.1"
coverage = "^5.5"
factory-boy = "^3.2.0"
pytest-factoryboy = "^2.1.0"
pytest-mock = "^3.6.0"
pytest-unordered = "^0.4.1"
requests-mock = "~1.9.3"
types-requests = "^2.25.6"

wdb = "^3.3.0"
ipdb = "^0.13.9"
see = "^1.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ['py39']
exclude = '''
(
    .venv
    | vendors
)
'''
